<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />

		<!--
			Theme engine — BLOCKING, first-paint inline script (no FOUC).
			Resolves the theme from localStorage, falling back to the OS
			`prefers-color-scheme`, and writes it to <html data-theme="…">
			BEFORE any stylesheet paints.

			Deliberately does NOT use SSR `transformPageChunk` + cookies:
			that would poison CDN caching and break the OS preference fallback.
		-->
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('vault-theme');
					var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					var theme = stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light';
					var root = document.documentElement;
					root.setAttribute('data-theme', theme);
					root.style.colorScheme = theme;
				} catch (e) {
					document.documentElement.setAttribute('data-theme', 'light');
				}
			})();
		</script>

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
